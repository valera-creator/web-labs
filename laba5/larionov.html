<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
          integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
          crossorigin="anonymous">
    <link rel="stylesheet" href="larionov_style.css">
    <title>Регистрация</title>
</head>
<body>
<h2 class="h">Регистрация на мероприятие</h2>
<div>
    <form class="form-login" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="username" class="form-label">Имя</label>
            <input type="text" class="form-control" id="username" name="username" required>

            <label for="lastname" class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="lastname" name="lastname" required>

            <label for="age" class="form-label">Возраст</label>
            <select class="form-select" id="age" name="age" required>
                <option value="" selected disabled>Выберите возраст</option>
            </select>

            <label class="form-label">Укажи, чем Вы владеете</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="html" name="languages" value="HTML">
                <label class="form-check-label" for="html">HTML/CSS</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="javascript" name="languages" value="JavaScript">
                <label class="form-check-label" for="javascript">JavaScript</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="python" name="languages" value="Python">
                <label class="form-check-label" for="python">Python</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="java" name="languages" value="Java">
                <label class="form-check-label" for="java">Java</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="cpp" name="languages" value="C++">
                <label class="form-check-label" for="cpp">C++</label>
            </div>

            <label for="email" class="form-label">Почта</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
</div>

<script>
    const ageSelect = document.getElementById('age'); // с id должен совпадать в select
    for (let age = 18; age <= 99; age++) {
        const option = document.createElement('option');
        option.value = age;
        option.textContent = age;
        ageSelect.appendChild(option);
    }
</script>
</body>
</html>
